# fixed project name: through a symlinked path, compose would derive another one and start an empty volume
name: project_name
services:
  app:
    build: .
    volumes:
      - .:/usr/src/app/
    environment:
      - OPENALEX_CONTACT_EMAIL
      - OPENAI_API_KEY
      - DB_HOST=db
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DEBUG
    networks:
      - postgres_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
  db:
    build: setup
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # PG18 images keep the data in a version subdirectory (/var/lib/postgresql/18/docker), so mount the parent
      - postgres18_data:/var/lib/postgresql
    #      - ./setup/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - postgres_network
    hostname: db
    ports:
      - "5432:5432"
volumes:
  # since 2026-09-28 (PG18 + VectorChord-bm25); the PG16 + pg_bestmatch data is in the old volume postgres_data
  postgres18_data:

networks:
  postgres_network:
    external: true