<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Recommender Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%232a78d6%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body data-step="intro">
    <header class="top">
      <div class="brand">
        <h1>Papers worth reading</h1>
        <p class="sub">New research, found from a description of your interests</p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="top-buttons">
        <button id="settings-button" class="small ghost" type="button" aria-haspopup="true" aria-expanded="false" title="Replay speed, pacing, corpus">⚙ Settings</button>
        <button id="theme" class="small ghost" type="button">Theme</button>
      </div>
      <div id="settings" class="popover" hidden>
        <label class="check" title="Pause before each stage, during live runs and replays; continue with Next, → or space"
          ><input type="checkbox" id="stepwise" checked /> pause between stages</label
        >
        <label class="check" title="Switch to each stage's view as it starts"><input type="checkbox" id="follow" checked /> follow the run</label>
        <label class="check"><input type="checkbox" id="show-timeline" checked /> show the API-call timeline</label>
        <label class="field"
          >replay speed
          <select id="speed" aria-label="Replay speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <label class="field">recording <select id="recordings" aria-label="Recorded run"></select></label>
        <hr />
        <label class="check" title="Fetch and embed the newest papers on the query's topics first (needed for a query outside the demo corpus)"
          ><input type="checkbox" id="ingest" /> live runs: fetch new papers first (+20–60 s)</label
        >
        <div class="corpus-row">
          <span id="corpus" class="status"></span>
          <button id="reset-corpus" class="small" type="button" hidden title="Delete the papers that live runs fetched, and rebuild the BM25 index">Reset corpus</button>
        </div>
        <hr />
        <p class="keys">
          <kbd>→</kbd> <kbd>space</kbd> <kbd>PgDn</kbd> next · <kbd>←</kbd> <kbd>PgUp</kbd> back · <kbd>1</kbd>–<kbd>4</kbd> stages · <kbd>i</kbd> details · <kbd>Esc</kbd> close
        </p>
      </div>
    </header>

    <nav class="stepbar" aria-label="Steps">
      <div class="stepper" id="stepper"></div>
      <div class="step-nav">
        <button id="back" type="button" title="Back (← or PgUp)">◂</button>
        <button id="next" class="primary" type="button" title="Next (→, space or PgDn)">Next ▸</button>
      </div>
    </nav>

    <section class="query-bar collapsed" id="query-bar">
      <div class="chips" id="query-chips"></div>
      <textarea id="query" rows="1" spellcheck="false" aria-label="Research interest"></textarea>
      <button id="expand-query" class="small ghost" type="button" title="Show the whole description">▾</button>
      <div class="run-buttons">
        <button id="run" type="button" title="Run the pipeline now, with real API calls (~25 s, ~$0.03)">▶ Run live</button>
        <button id="replay" type="button" title="Play a recorded run of this query (no network needed)">▶ Replay</button>
        <button id="skip" class="small" type="button" hidden>Skip to end</button>
        <button id="stop" class="small" type="button" hidden>Stop</button>
      </div>
      <span id="status" class="status"></span>
    </section>

    <main class="views" id="views">
      <section class="view page" id="view-intro"></section>
      <section class="view page" id="view-system" hidden></section>
      <section class="view" id="view-topics" hidden></section>
      <section class="view" id="view-retrieval" hidden></section>
      <section class="view" id="view-rerank" hidden></section>
      <section class="view" id="view-summaries" hidden></section>
      <section class="view" id="view-results" hidden></section>
      <section class="view page" id="view-takeaways" hidden></section>
      <div class="no-run" id="no-run" hidden>
        <p>This step fills in during a run.</p>
        <div class="no-run-buttons">
          <button id="no-run-replay" class="primary" type="button">▶ Replay the recorded run</button>
          <button id="no-run-live" type="button">▶ Run live</button>
        </div>
      </div>
    </main>

    <footer class="timeline" id="timeline"></footer>

    <aside class="drawer" id="drawer" hidden aria-label="Details">
      <div class="drawer-head">
        <h2 id="drawer-title">Details</h2>
        <button id="drawer-close" class="small ghost" type="button" title="Close (Esc)">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div id="tooltip" class="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
