<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Recommender Demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%232a78d6%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>Papers worth reading, from a description of your research</h1>
        <p class="sub">free text → OpenAlex topics → hybrid retrieval → setwise LLM reranking → tailored summaries</p>
      </div>
      <div class="stats" id="stats"></div>
      <button id="theme" class="small ghost" type="button">Theme</button>
    </header>

    <section class="query-bar">
      <div class="query-left">
        <div class="chips" id="query-chips"></div>
        <textarea id="query" rows="3" spellcheck="false" aria-label="Research interest"></textarea>
      </div>
      <div class="controls">
        <div class="control-row">
          <button id="run" class="primary" type="button">▶ Run live</button>
          <label class="check" title="Fetch and embed the newest papers on the query's topics first (needed for a query outside the demo corpus)"
            ><input type="checkbox" id="ingest" /> fetch new papers first (+20–60 s)</label
          >
        </div>
        <div class="control-row corpus-row">
          <span id="corpus" class="status"></span>
          <button id="reset-corpus" class="small" type="button" hidden title="Delete the papers that live runs fetched, and rebuild the BM25 index">Reset corpus</button>
        </div>
        <div class="control-row">
          <select id="recordings" aria-label="Recorded run"></select>
          <select id="speed" aria-label="Replay speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <label class="check" title="Pause before each stage; continue with the button or the space key"><input type="checkbox" id="stepwise" /> stage by stage</label>
          <button id="replay" type="button">▶ Replay</button>
        </div>
        <div class="control-row playback">
          <button id="continue" class="primary" type="button" hidden>Continue ▸</button>
          <button id="skip" type="button" hidden>Skip to end</button>
          <button id="stop" type="button" hidden>Stop</button>
          <span id="status" class="status"></span>
        </div>
      </div>
    </section>

    <nav class="pipeline" id="pipeline" aria-label="Pipeline stages"></nav>

    <main class="views">
      <section class="view" id="view-topics"></section>
      <section class="view" id="view-retrieval" hidden></section>
      <section class="view" id="view-rerank" hidden></section>
      <section class="view" id="view-summaries" hidden></section>
    </main>

    <footer class="timeline" id="timeline"></footer>

    <div id="tooltip" class="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
