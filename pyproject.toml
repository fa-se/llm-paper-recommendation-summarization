[project]
name = "llm-paper-recommendation-summarization"
version = "0.2.0"
description = "Paper recommendation and tailored summaries from a free-form description of a research interest (TU Berlin master's thesis)"
readme = "README.md"
license = "Apache-2.0"
# PEP 701 f-strings; developed on 3.14, also tested on 3.12
requires-python = ">=3.12"
dependencies = [
    "openai>=3.19",
    "pgvector>=0.5",
    "psycopg[binary,pool]>=3.3",
    "pyalex>=0.21",
    "sqlalchemy>=2.1",
    "tiktoken>=0.14",
    # only for utils/decorator.py, a leftover of the removed CLI
    "typer>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "db", "utils"]

[tool.hatch.build]
# the editable install puts the repo root on sys.path, so setup/ scripts and tests import core, db and setup.* from anywhere
dev-mode-dirs = ["."]
